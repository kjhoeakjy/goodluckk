name: 추천 자료
run-name: "추천 자료 ${{ github.event_name == 'schedule' && '자동' || '수동' }}"
on:
  workflow_dispatch:
    inputs:
      once:
        description: "1회만 발행(장중 반복 없음)"
        type: boolean
        default: true
  schedule:
    # 평일 07:15~15:45 KST 15분 간격. 실행 중이면 새 예약분은 대기하다가 앞 실행 종료 후 이어받음(예약 누락·작업 시간 한도 대비)
    - cron: "15,30,45 22 * * 0-4"
    - cron: "*/15 23 * * 0-4"
    - cron: "*/15 0-6 * * 1-5"
permissions:
  contents: write
concurrency:
  group: feed
  cancel-in-progress: false
jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q cryptography
      - name: live 브랜치 받기
        run: |
          mkdir -p out && cd out
          git init -q -b live
          git config user.name github-actions
          git config user.email actions@github.com
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          if git fetch -q --depth=1 origin live 2>/dev/null; then git reset -q --hard FETCH_HEAD; fi
      - name: 발행
        env:
          SRC_PASSWORD: ${{ secrets.SRC_PASSWORD }}
          SRC_TOKEN: ${{ secrets.SRC_TOKEN }}
          PW_BASIC: ${{ secrets.PW_BASIC }}
          PW_PREMIUM: ${{ secrets.PW_PREMIUM }}
          FEED_OUT: out
          PYTHONUNBUFFERED: "1"
        run: python feed/feed.py ${{ (github.event_name == 'workflow_dispatch' && inputs.once) && 'once' || 'run' }}
